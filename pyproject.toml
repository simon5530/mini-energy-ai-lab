[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-energy-ai-lab"
version = "0.2.0"
description = "A staged, simulated Energy AI learning lab"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Simon Huang" }]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
mini-energy-sim = "simulator.cli:main"

[tool.setuptools.packages.find]
include = ["simulator*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
